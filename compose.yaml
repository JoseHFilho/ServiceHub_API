services:
  postgres:
    image: postgres:15
    container_name: servicehub-db
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: servicehub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - servicehub-postgres-data:/var/lib/postgresql/data

volumes:
  servicehub-postgres-data:
