# Porta do servidor
server.port=${SERVER_PORT:8080}

# Nome da aplicação
spring.application.name=servicehub-api

# Nível de log
logging.level.com.servicehub=INFO

# Log de SQL desabilitado por padrão
spring.jpa.show-sql=false

# Configuração do DataSource (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55433/servicehub}
spring.datasource.username=${DB_USERNAME:servicehub}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
servicehub.database.manage-runtime-grants=${DATABASE_MANAGE_RUNTIME_GRANTS:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.persist-authorization=false
management.endpoints.web.exposure.include=health
springdoc.show-actuator=true

# Chave obrigatória em Base64; não há segredo de fallback em nenhum perfil.
servicehub.jwt.secret=${JWT_SECRET:}
servicehub.jwt.ttl=${JWT_TTL:15m}
servicehub.jwt.issuer=${JWT_ISSUER:servicehub-api}

# Shared PostgreSQL admission limits; keys contain HMAC digests, never raw origins/accounts.
servicehub.auth-guard.enabled=${AUTH_GUARD_ENABLED:true}
servicehub.auth-guard.window-seconds=${AUTH_WINDOW_SECONDS:60}
servicehub.auth-guard.login-ip-limit=${AUTH_LOGIN_IP_LIMIT:30}
servicehub.auth-guard.login-account-limit=${AUTH_LOGIN_ACCOUNT_LIMIT:10}
servicehub.auth-guard.login-global-limit=${AUTH_LOGIN_GLOBAL_LIMIT:120}
servicehub.auth-guard.registration-ip-limit=${AUTH_REGISTRATION_IP_LIMIT:5}
servicehub.auth-guard.registration-account-limit=${AUTH_REGISTRATION_ACCOUNT_LIMIT:3}
servicehub.auth-guard.registration-global-limit=${AUTH_REGISTRATION_GLOBAL_LIMIT:30}
servicehub.auth-guard.max-concurrent=${AUTH_MAX_CONCURRENT:2}
servicehub.request-limits.authentication-bytes=${AUTH_BODY_BYTES:8192}
servicehub.request-limits.rest-bytes=${REST_BODY_BYTES:65536}
server.forward-headers-strategy=none

# GraphQL: mesmo JWT do REST; ferramentas e introspecção fechadas por padrão.
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=false
spring.graphql.schema.introspection.enabled=false
spring.graphql.schema.printer.enabled=false
