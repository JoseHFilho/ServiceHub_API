# Porta do servidor
server.port=${SERVER_PORT:8080}

# Nome da aplicação
spring.application.name=servicehub-api

# Nível de log
logging.level.com.servicehub=INFO

# Log de SQL desabilitado por padrão
spring.jpa.show-sql=false

# Configuração do DataSource (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55433/servicehub}
spring.datasource.username=${DB_USERNAME:servicehub}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
management.endpoints.web.exposure.include=health
springdoc.show-actuator=true
