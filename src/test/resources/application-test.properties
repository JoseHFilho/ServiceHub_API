spring.datasource.url=jdbc:h2:mem:servicehub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.graphql.schema.introspection.enabled=true
# Bulk business fixtures do not share rate windows. Dedicated admission tests enable the guard.
servicehub.auth-guard.enabled=false
spring.test.mockmvc.print=none
